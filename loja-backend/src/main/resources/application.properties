spring.application.name=loja-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/loja}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Origens liberadas no CORS (lidas do ambiente; default = front local do Vite)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}


# O schema agora é gerido pelo Flyway. O Hibernate apenas valida (não altera o banco).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway — migrations versionadas em src/main/resources/db/migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Configurações do Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# pasta onde os comprovantes serão salvos (relativa ao root da aplicação ou absoluta)
# Em produção é sobrescrita pela variável COMPROVANTES_STORAGE (volume persistente).
comprovantes.storage=${COMPROVANTES_STORAGE:comprovantes}
