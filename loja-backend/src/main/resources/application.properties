spring.application.name=loja-backend

# A URL também pode variar entre dev e prod, mas para localhost pode manter ou usar variável
spring.datasource.url=jdbc:postgresql://localhost:5432/loja
spring.datasource.username=postgres

# AQUI ESTÁ A MUDANÇA: O Spring vai buscar uma variável de ambiente chamada DB_PASSWORD
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configurações do Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Pasta de comprovantes
comprovantes.storage=comprovantes