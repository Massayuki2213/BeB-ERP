# Configurações sobrescritas nos testes de integração
# Usa um banco DEDICADO (loja_test) no PostgreSQL do Docker Compose (localhost:5432).
# NUNCA aponte para o banco "loja": os testes apagam todas as tabelas no @BeforeEach.
spring.datasource.url=jdbc:postgresql://localhost:5432/loja_test
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
