# docker-compose de PRODUÇÃO.
#
# Diferenças para o docker-compose.yml de desenvolvimento:
#   - SEM Adminer (painel do banco não fica exposto).
#   - SEM portas publicadas no banco/backend/frontend: só o Caddy fala com a internet.
#   - Caddy na frente, com HTTPS automático + senha de login.
#   - Volumes nomeados para o banco E para os comprovantes (não somem em deploy).
#   - Memória da JVM limitada (cabe folgado em um VPS de 4 GB).
#
# Subir com:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: beb-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Sem "ports": o banco NÃO é acessível de fora do servidor.

  backend:
    build:
      context: ./loja-backend
      dockerfile: Dockerfile
    container_name: beb-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # Comprovantes vão para um volume persistente (não some entre deploys).
      COMPROVANTES_STORAGE: /data/comprovantes
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    volumes:
      - comprovantes:/data/comprovantes
    # Sem "ports": só a rede interna (frontend) fala com o backend.

  frontend:
    build:
      context: ./erp-frontend
      dockerfile: Dockerfile
      args:
        # API na mesma origem: o nginx do front repassa /api -> backend.
        VITE_API_BASE_URL: /api
    container_name: beb-frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Sem "ports": só o Caddy fala com o frontend.

  caddy:
    image: caddy:2-alpine
    container_name: beb-caddy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    # Injeta SITE_ADDRESS / BASIC_AUTH_USER / BASIC_AUTH_HASH no container.
    env_file:
      - .env.prod
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # guarda os certificados HTTPS (não perder!)
      - caddy_config:/config

volumes:
  db_data:
  comprovantes:
  caddy_data:
  caddy_config:
