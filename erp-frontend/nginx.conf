server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API na mesma origem do front: o nginx repassa /api para o backend.
    # Isso faz o app funcionar pelo celular (basta o IP do PC) e dispensa CORS.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Service worker e manifest não podem ficar presos em cache do browser
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Assets com hash no nome podem ser cacheados "para sempre"
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota desconhecida cai no index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
